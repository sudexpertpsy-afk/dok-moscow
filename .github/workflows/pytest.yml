name: Pytest

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: ShellCheck deploy scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: deploy
          severity: warning
        env:
          SHELLCHECK_OPTS: --shell=bash

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            web/requirements.txt
            web/requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt

      - name: Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/web:${{ github.workspace }}/core
        run: python -m pytest -q --tb=line
