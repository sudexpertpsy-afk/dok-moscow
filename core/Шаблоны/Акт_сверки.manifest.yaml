описание: Акт сверки взаимных расчётов.
группа: Счета и акты
поля:
  номер_сверки: {тип: счётчик, подпись: Номер акта сверки, обязательное: да}
  дата_сверки: {тип: дата, подпись: Дата акта, по_умолчанию: сегодня}
  дата_сверки_с: {тип: дата, подпись: Период с}
  дата_сверки_по: {тип: дата, подпись: Период по}
  контрагент_название: {тип: строка, подпись: Контрагент, обязательное: да}
  контрагент_подписант: {тип: строка, подпись: Подписант контрагента}
  сальдо_начало: {тип: строка, подпись: Сальдо начальное, по_умолчанию: "0"}
  оборот_дебет: {тип: строка, подпись: Обороты дебет, по_умолчанию: "0"}
  оборот_кредит: {тип: строка, подпись: Обороты кредит, по_умолчанию: "0"}
  сальдо_конец: {тип: строка, подпись: Сальдо конечное, по_умолчанию: "0"}
  задолженность_текст: {тип: многострочный, подпись: Формулировка задолженности, по_умолчанию: "Задолженность отсутствует."}
