# черновик W-46: подписи вычитать владельцу
описание: Приходный кассовый ордер (форма КО-1) на поступление наличных.
группа: Кассовые
поля:
  дата_пко: {тип: дата, подпись: Дата ПКО, по_умолчанию: сегодня}
  номер_пко: {тип: счётчик, подпись: Номер ПКО, обязательное: да}
  основание_пко: {тип: строка, подпись: Основание ПКО}
  приложение_пко: {тип: строка, подпись: Приложение к ПКО}
  принято_от: {тип: строка, подпись: Принято от}
  сумма: {тип: деньги, подпись: Сумма}
