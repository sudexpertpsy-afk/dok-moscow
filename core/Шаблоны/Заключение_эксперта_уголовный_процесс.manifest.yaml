описание: Заключение эксперта по уголовному делу (ст. 204 УПК РФ, ст. 25 ФЗ-73). Универсален для любых видов экспертиз.
группа: Заключения эксперта
поля:
  номер_заключения: {тип: счётчик, подпись: Номер заключения, обязательное: да}
  номер_дела: {тип: строка, подпись: Номер дела, обязательное: да}
  вид_экспертизы: {тип: строка, подпись: Вид экспертизы (им. падеж), подсказка: "судебно-психологическая экспертиза"}
  вид_экспертизы_род: {тип: строка, подпись: Вид экспертизы (род. падеж), подсказка: "судебно-психологической экспертизы"}
  дата_начала: {тип: дата, подпись: Дата начала экспертизы}
  время_начала: {тип: строка, подпись: Время начала, подсказка: "10:00"}
  дата_окончания: {тип: дата, подпись: Дата окончания}
  время_окончания: {тип: строка, подпись: Время окончания}
  место_производства: {тип: строка, подпись: Место производства экспертизы}
  назначивший: {тип: строка, подпись: Должностное лицо (орган), назначившее экспертизу, обязательное: да}
  дата_основания: {тип: дата, подпись: Дата определения/постановления, подсказка: "Постановление о назначении экспертизы"}
  фио_эксперта: {тип: строка, подпись: ФИО эксперта (им. падеж), обязательное: да}
  фио_эксперта_дат: {тип: строка, подпись: ФИО эксперта (дат. падеж — «Мне, …»)}
  фио_эксперта_кратко: {тип: строка, подпись: Эксперт кратко (И.О. Фамилия)}
  образование_эксперта: {тип: строка, подпись: Образование}
  специальность_эксперта: {тип: строка, подпись: Специальность}
  стаж_эксперта: {тип: строка, подпись: Стаж работы по специальности}
  учёная_степень: {тип: строка, подпись: "Учёная степень, звание (или «не имеет»)"}
  должность_эксперта: {тип: строка, подпись: Занимаемая должность}
  вопросы_эксперту: {тип: многострочный, подпись: Вопросы перед экспертом, обязательное: да}
  объекты_исследования: {тип: многострочный, подпись: Объекты исследований}
  материалы_дела: {тип: многострочный, подпись: Материалы дела (тома, л.д.)}
  присутствовавшие: {тип: строка, подпись: "Присутствовавшие (или «не присутствовали»)", по_умолчанию: не присутствовали}
  применённые_методы: {тип: многострочный, подпись: Применённые методы и методики}
  содержание_исследования: {тип: многострочный, подпись: Исследовательская часть (можно заполнить в Word)}
  оценка_результатов: {тип: многострочный, подпись: Оценка результатов (можно заполнить в Word)}
  выводы: {тип: многострочный, подпись: Выводы (можно заполнить в Word)}
  дополнительные_обстоятельства: {тип: многострочный, подпись: Обстоятельства по инициативе эксперта, по_умолчанию: не установлены}
  приложения: {тип: многострочный, подпись: Приложения}
  дата_заключения: {тип: дата, подпись: Дата заключения, по_умолчанию: сегодня}
  год: {тип: строка, подпись: Год (для подписки), по_умолчанию: "2026"}
