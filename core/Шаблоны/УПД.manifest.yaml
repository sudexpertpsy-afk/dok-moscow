описание: Универсальный передаточный документ (статус 1 — СФ+передача, статус 2 — передача).
группа: Счета и акты
поля:
  номер_упд: {тип: счётчик, подпись: Номер УПД, обязательное: да}
  дата_упд: {тип: дата, подпись: Дата УПД, по_умолчанию: сегодня}
  статус_упд: {тип: выбор, подпись: Статус, варианты: ["1", "2"], по_умолчанию: "1"}
  номер_договора: {тип: строка, подпись: Номер договора}
  дата_договора: {тип: дата, подпись: Дата договора}
  наименование_услуги: {тип: строка, подпись: Наименование, обязательное: да}
  единица_измерения: {тип: строка, подпись: Ед. изм., по_умолчанию: усл.}
  количество: {тип: строка, подпись: Количество, по_умолчанию: "1"}
  цена: {тип: строка, подпись: Цена}
  ставка_ндс: {тип: выбор, подпись: Ставка НДС, варианты: ["Без НДС", "0 %", "10 %", "20 %", "10 % / 110 %", "20 % / 120 %"], по_умолчанию: "Без НДС"}
  сумма_без_ндс: {тип: строка, подпись: Сумма без НДС}
  сумма_ндс: {тип: строка, подпись: Сумма НДС, по_умолчанию: "0"}
  сумма: {тип: деньги, подпись: Всего с НДС, обязательное: да}
  покупатель_название: {тип: строка, подпись: Покупатель}
  покупатель_адрес: {тип: строка, подпись: Адрес покупателя}
  покупатель_инн: {тип: строка, подпись: ИНН покупателя}
  покупатель_кпп: {тип: строка, подпись: КПП покупателя}
  получатель_подписант: {тип: строка, подпись: Подписант покупателя}
