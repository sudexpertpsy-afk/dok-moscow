# черновик W-46: подписи вычитать владельцу
описание: Демо-шаблон ходатайства о назначении судебной экспертизы. Показывает работу склонений ФИО, суммы прописью и дат.
группа: Письма суду
поля:
  адрес_заявителя: {тип: строка, подпись: Адрес заявителя}
  вопрос_1: {тип: многострочный, подпись: Вопрос эксперту 1}
  вопрос_2: {тип: многострочный, подпись: Вопрос эксперту 2}
  дата_оплаты: {тип: дата, подпись: Дата оплаты, по_умолчанию: сегодня}
  заявитель: {тип: строка, подпись: Заявитель}
  истец: {тип: строка, подпись: Истец}
  номер_дела: {тип: строка, подпись: Номер дела}
  ответчик: {тип: строка, подпись: Ответчик}
  плательщик: {тип: строка, подпись: Плательщик}
  стоимость: {тип: деньги, подпись: Стоимость}
  суд: {тип: строка, подпись: Суд}
  суд_род: {тип: строка, подпись: Суд (род. падеж)}
  телефон: {тип: строка, подпись: Телефон}
  тип_экспертизы: {тип: строка, подпись: Тип экспертизы}
  экспертное_учреждение: {тип: строка, подпись: Экспертное учреждение}
