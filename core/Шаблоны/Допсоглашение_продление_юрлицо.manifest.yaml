# черновик W-46: подписи вычитать владельцу
описание: Допсоглашение о продлении срока договора (юрлицо).
группа: Прочее
поля:
  дата_договора: {тип: дата, подпись: Дата договора, по_умолчанию: сегодня}
  дата_допсоглашения: {тип: дата, подпись: Дата допсоглашения, по_умолчанию: сегодня}
  название_заказчика: {тип: строка, подпись: Название организации, обязательное: да}
  номер_договора: {тип: счётчик, подпись: Номер договора, обязательное: да}
  номер_допсоглашения: {тип: счётчик, подпись: Номер допсоглашения}
