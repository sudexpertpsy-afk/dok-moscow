# черновик W-46: подписи вычитать владельцу
описание: Информационное письмо суду об экспертной организации для назначения судебной психолого-педагогической экспертизы. Несколько подэкспертных лиц.
группа: Письма суду
поля:
  адресат: {тип: многострочный, подпись: Адресат (кому направляется)}
  вх_дата: {тип: дата, подпись: Дата входящего, по_умолчанию: сегодня}
  вх_номер: {тип: строка, подпись: Входящий номер}
  запрос_от: {тип: строка, подпись: Запрос от (дата)}
  исх_дата: {тип: дата, подпись: Дата исходящего, по_умолчанию: сегодня}
  исх_номер: {тип: счётчик, подпись: Исходящий номер, обязательное: да}
  номер_дела: {тип: строка, подпись: Номер дела}
  срок_дней: {тип: строка, подпись: Срок (календарных дней)}
  тип_экспертизы: {тип: строка, подпись: Тип экспертизы}
  тип_экспертизы2: {тип: строка, подпись: Тип экспертизы (доп.)}
  условие_срока: {тип: строка, подпись: Условие срока}
  цена_итог: {тип: деньги, подпись: Итоговая цена}
  цена_многих: {тип: деньги, подпись: Цена (несколько)}
  цена_многих2: {тип: деньги, подпись: Цена (несколько, вариант 2)}
  цена_один: {тип: деньги, подпись: Цена (одно заключение)}
  цена_один2: {тип: деньги, подпись: Цена (одно заключение, вариант 2)}
