# черновик W-46: подписи вычитать владельцу
описание: Уведомление о расторжении договора (физлицо).
группа: Письма суду
поля:
  дата_договора: {тип: дата, подпись: Дата договора, по_умолчанию: сегодня}
  дата_расторжения: {тип: дата, подпись: Дата расторжения, по_умолчанию: сегодня}
  дата_уведомления: {тип: дата, подпись: Дата уведомления, по_умолчанию: сегодня}
  дополнительные_условия: {тип: многострочный, подпись: Дополнительные условия}
  исх_номер: {тип: счётчик, подпись: Исходящий номер, обязательное: да}
  номер_договора: {тип: счётчик, подпись: Номер договора, обязательное: да}
