описание: Универсальное сопроводительное письмо о направлении документов (заключения эксперта, материалов дела, иных документов) в суд, орган или заказчику.
группа: Письма суду
поля:
  исх_номер: {тип: счётчик, подпись: Исходящий номер, обязательное: да}
  исх_дата: {тип: дата, подпись: Дата письма, по_умолчанию: сегодня}
  вх_номер: {тип: строка, подпись: "На № (вх. номер; «—», если нет)", по_умолчанию: "—"}
  вх_дата: {тип: строка, подпись: "От (дата вх.; «—», если нет)", по_умолчанию: "—"}
  адресат: {тип: многострочный, подпись: Адресат, подсказка: "В Тверской районный суд г. Москвы (судье …) / Следователю … / Генеральному директору ООО «…»", обязательное: да}
  адрес_адресата: {тип: строка, подпись: Адрес адресата}
  обращение: {тип: строка, подпись: Обращение, по_умолчанию: "Уважаемый суд!"}
  что_направляется_род: {тип: строка, подпись: Что направляется (род. падеж — для темы), подсказка: "заключения эксперта"}
  что_направляется_вин: {тип: многострочный, подпись: Что направляется (вин. падеж — для текста), подсказка: "заключение эксперта № … от … на … листах в 1 экземпляре", обязательное: да}
  основание_направления: {тип: многострочный, подпись: Основание направления, подсказка: "Во исполнение определения … по делу № … / В соответствии с договором № … / В ответ на Ваш запрос"}
  дополнительный_текст: {тип: многострочный, подпись: Дополнительный абзац (необязательно)}
  приложения: {тип: многострочный, подпись: Приложение (перечень с листами и экз.), обязательное: да}
  исполнитель_письма: {тип: строка, подпись: Исполнитель (И.О. Фамилия)}
  телефон_исполнителя: {тип: строка, подпись: Телефон исполнителя}
