# черновик W-46: подписи вычитать владельцу
описание: Согласие субъекта на обработку персональных данных.
группа: Прочее
поля:
  адрес_субъекта: {тип: строка, подпись: Адрес субъекта ПДн}
  дата_согласия: {тип: дата, подпись: Дата согласия, по_умолчанию: сегодня}
  паспорт_субъекта: {тип: строка, подпись: Паспортные данные субъекта}
  фио_субъекта: {тип: строка, подпись: ФИО субъекта ПДн}
  цели_обработки: {тип: многострочный, подпись: Цели обработки персональных данных}
