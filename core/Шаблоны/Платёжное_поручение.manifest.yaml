описание: Платёжное поручение (в т.ч. бюджетные платежи с КБК/ОКТМО).
группа: Банковские
поля:
  номер_платёжки: {тип: счётчик, подпись: Номер платёжного поручения, обязательное: да}
  дата_платёжки: {тип: дата, подпись: Дата, по_умолчанию: сегодня}
  вид_платежа: {тип: строка, подпись: Вид платежа, по_умолчанию: электронно}
  сумма: {тип: деньги, подпись: Сумма, обязательное: да}
  плательщик_название: {тип: строка, подпись: Плательщик}
  плательщик_инн: {тип: строка, подпись: ИНН плательщика}
  плательщик_кпп: {тип: строка, подпись: КПП плательщика}
  плательщик_рс: {тип: строка, подпись: Расчётный счёт плательщика}
  плательщик_банк: {тип: строка, подпись: Банк плательщика}
  плательщик_бик: {тип: строка, подпись: БИК плательщика}
  плательщик_кс: {тип: строка, подпись: Корр. счёт плательщика}
  получатель_название: {тип: строка, подпись: Получатель, обязательное: да}
  получатель_инн: {тип: строка, подпись: ИНН получателя}
  получатель_кпп: {тип: строка, подпись: КПП получателя}
  получатель_рс: {тип: строка, подпись: Расчётный счёт получателя}
  получатель_банк: {тип: строка, подпись: Банк получателя}
  получатель_бик: {тип: строка, подпись: БИК получателя}
  получатель_кс: {тип: строка, подпись: Корр. счёт получателя}
  статус_составителя: {тип: строка, подпись: Статус составителя, по_умолчанию: "01"}
  кбк: {тип: строка, подпись: КБК}
  октмо: {тип: строка, подпись: ОКТМО}
  основание_платежа: {тип: строка, подпись: Основание платежа (налог.)}
  очередность_платежа: {тип: строка, подпись: Очерёдность, по_умолчанию: "5"}
  назначение_платежа: {тип: многострочный, подпись: Назначение платежа, обязательное: да}
