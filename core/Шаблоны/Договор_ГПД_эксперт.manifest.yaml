# черновик W-46: подписи вычитать владельцу
описание: Договор оказания услуг с физлицом-экспертом (ГПД).
группа: Договоры
поля:
  дата_договора: {тип: дата, подпись: Дата договора, по_умолчанию: сегодня}
  дата_начала: {тип: дата, подпись: Дата начала, по_умолчанию: сегодня}
  дата_окончания: {тип: дата, подпись: Дата окончания, по_умолчанию: сегодня}
  номер_договора: {тип: счётчик, подпись: Номер договора, обязательное: да}
  предмет_услуг: {тип: многострочный, подпись: Предмет услуг}
  сумма: {тип: деньги, подпись: Сумма}
  фио_эксперта: {тип: строка, подпись: ФИО эксперта, обязательное: да}
