описание: Расходный кассовый ордер (унифицированная форма № КО-2).
группа: Кассовые
поля:
  номер_рко: {тип: счётчик, подпись: Номер РКО, обязательное: да}
  дата_рко: {тип: дата, подпись: Дата РКО, по_умолчанию: сегодня}
  выдано_рко: {тип: строка, подпись: Выдать (кому), обязательное: да}
  основание_рко: {тип: строка, подпись: Основание}
  приложение_рко: {тип: строка, подпись: Приложение, по_умолчанию: "—"}
  сумма: {тип: деньги, подпись: Сумма, обязательное: да}
  ставка_ндс: {тип: выбор, подпись: НДС, варианты: ["Без НДС", "0 %", "10 %", "20 %", "10 % / 110 %", "20 % / 120 %"], по_умолчанию: "Без НДС"}
