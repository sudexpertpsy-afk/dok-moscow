# черновик W-46: подписи вычитать владельцу
описание: "Договор услуг для ЮРИДИЧЕСКОГО ЛИЦА. Реквизиты: название_заказчика, инн/огрн/кпп_заказчика, юр_адрес_заказчика, должность_подписанта_род (в род. падеже!), фио_подписанта, основание_подписанта (Устава / Доверенности № X от Y)."
группа: Договоры
поля:
  email_клиента: {тип: строка, подпись: E-mail клиента}
  дата_акта: {тип: дата, подпись: Дата акта, по_умолчанию: сегодня}
  дата_договора: {тип: дата, подпись: Дата договора, по_умолчанию: сегодня}
  должность_подписанта_род: {тип: строка, подпись: Должность подписанта (род. падеж)}
  инн_заказчика: {тип: строка, подпись: ИНН заказчика}
  итоговый_документ: {тип: строка, подпись: Итоговый документ}
  кпп_заказчика: {тип: строка, подпись: КПП заказчика}
  название_заказчика: {тип: строка, подпись: Название организации, обязательное: да}
  номер_договора: {тип: счётчик, подпись: Номер договора, обязательное: да}
  огрн_заказчика: {тип: строка, подпись: ОГРН заказчика}
  основание_подписанта: {тип: строка, подпись: Основание полномочий подписанта}
  предмет_договора: {тип: многострочный, подпись: Предмет договора}
  срок_рабочих_дней: {тип: строка, подпись: Срок (рабочих дней)}
  сумма: {тип: деньги, подпись: Сумма}
  телефон_клиента: {тип: строка, подпись: Телефон клиента}
  фио_подписанта: {тип: строка, подпись: ФИО подписанта}
  юр_адрес_заказчика: {тип: строка, подпись: Юридический адрес заказчика}
