{% extends "base.html" %}
{% block title %}Вход — {{ app_name }}{% endblock %}
{% block body %}
<div class="shell" id="main" tabindex="-1">
  <div class="card">
    <h1 class="brand">{{ app_name }}</h1>
    <p class="lead">Кабинет экспертной организации</p>
    {% if flash_error %}<div class="alert alert-error">{{ flash_error }}</div>{% endif %}
    {% if flash_ok %}<div class="alert alert-ok">{{ flash_ok }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required autocomplete="username" value="{{ email or '' }}">
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <div class="actions">
        <button type="submit">Войти</button>
        <a class="btn secondary" href="/forgot-password">Забыли пароль?</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
