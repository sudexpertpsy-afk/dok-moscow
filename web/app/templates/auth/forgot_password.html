{% extends "base.html" %}
{% block title %}Сброс пароля — {{ app_name }}{% endblock %}
{% block body %}
<div class="shell" id="main" tabindex="-1">
  <div class="card">
    <h1 class="brand">{{ app_name }}</h1>
    <p class="lead">Восстановление доступа по e-mail</p>
    {% if flash_error %}<div class="alert alert-error">{{ flash_error }}</div>{% endif %}
    {% if flash_ok %}<div class="alert alert-ok">{{ flash_ok }}</div>{% endif %}
    <form method="post" action="/forgot-password" hx-boost="false">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="email">E-mail учётной записи</label>
      <input id="email" name="email" type="email" required autocomplete="username" value="{{ email or '' }}">
      <div class="actions">
        <button type="submit">Отправить ссылку</button>
        <a class="btn secondary" href="/login">Назад</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
