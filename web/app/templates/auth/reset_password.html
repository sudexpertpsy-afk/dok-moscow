{% extends "base.html" %}
{% block title %}Новый пароль — {{ app_name }}{% endblock %}
{% block body %}
<div class="shell">
  <div class="card">
    <h1 class="brand">{{ app_name }}</h1>
    <p class="lead">Задайте новый пароль</p>
    {% if flash_error %}<div class="alert alert-error">{{ flash_error }}</div>{% endif %}
    <p class="muted">{{ password_hint }}</p>
    <form method="post" action="/reset-password/{{ token }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="password">Новый пароль</label>
      <input id="password" name="password" type="password" required minlength="10" autocomplete="new-password">
      <label for="password2">Повтор пароля</label>
      <input id="password2" name="password2" type="password" required minlength="10" autocomplete="new-password">
      <div class="actions">
        <button type="submit">Сохранить</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
