<div class="layout">
  <aside class="sidebar">
    <div class="brand">{{ app_name }}</div>
    <div class="org">Администратор сервиса</div>
    <nav class="nav" data-nav-sortable data-nav-area="admin" aria-label="Меню администратора">
      {% for key, label, href in admin_nav %}
      <div class="nav-item" draggable="true" data-nav-key="{{ key }}">
        <button type="button" class="nav-handle" title="Перетащить пункт меню" aria-label="Перетащить «{{ label }}»" tabindex="-1">⋮⋮</button>
        <a href="{{ href }}" class="{% if active == key %}active{% endif %}" hx-boost="true">{{ label }}</a>
      </div>
      {% endfor %}
    </nav>
    <p class="nav-hint">Перетащите ⋮⋮, чтобы изменить порядок</p>
  </aside>
  <main id="main" class="content" tabindex="-1">
    <div class="topbar">
      <button type="button" class="gs-trigger" data-gs-open title="Поиск (Ctrl+K)">
        <span class="gs-trigger-label">Поиск…</span>
        <kbd>Ctrl K</kbd>
      </button>
      <span>{{ user.email }}</span>
      <form method="post" action="/logout" hx-boost="false">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit">Выйти</button>
      </form>
    </div>
    {% if flash_error %}<div class="alert alert-error">{{ flash_error }}</div>{% endif %}
    {% if flash_ok %}<div class="alert alert-ok">{{ flash_ok }}</div>{% endif %}
