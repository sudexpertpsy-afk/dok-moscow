<div class="layout">
  <aside class="sidebar">
    <div class="brand">{{ app_name }}</div>
    <div class="org">Администратор сервиса</div>
    <nav class="nav">
      {% for key, label, href in admin_nav %}
        <a href="{{ href }}" class="{% if active == key %}active{% endif %}">{{ label }}</a>
      {% endfor %}
    </nav>
  </aside>
  <main id="main" class="content" tabindex="-1">
    <div class="topbar">
      <span>{{ user.email }}</span>
      <form method="post" action="/logout" hx-boost="false">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit">Выйти</button>
      </form>
    </div>
    {% if flash_error %}<div class="alert alert-error">{{ flash_error }}</div>{% endif %}
    {% if flash_ok %}<div class="alert alert-ok">{{ flash_ok }}</div>{% endif %}
