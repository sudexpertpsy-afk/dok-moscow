# Док.Москва — Docker Compose (W-07)
# Запуск из каталога deploy/: docker compose --env-file .env up -d
name: dok

services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    networks: [dok]

  app:
    image: ${DOK_IMAGE:-dok-app:local}
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    env_file: .env
    environment:
      DB_URL: postgresql+psycopg://dok:${POSTGRES_PASSWORD}@postgres:5432/dok
      FILES_ROOT: /srv/dok/data/files
      GOTENBERG_URL: http://gotenberg:3000
      CORE_PATH: /app/core
      TEMPLATES_DIR: /srv/dok/data/templates
      APP_VERSION: ${APP_VERSION:-dev}
      BILLING_WORKER: "0"
      JOBS_INLINE: "0"
      OPS_AGENT_URL: http://ops-agent:9100
    command:
      - "uvicorn"
      - "app.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--workers"
      - "2"
      # Caddy шлёт X-Forwarded-Proto; без allow-ips Starlette строит Location: http://…
      - "--forwarded-allow-ips"
      - "*"
    volumes:
      # W-46: host-путь == контейнер (вместо named volume dok_files)
      - /srv/dok/data/files:/srv/dok/data/files
      - /srv/dok/data/templates:/srv/dok/data/templates
      # маркер deploy.sh → /admin/status; W-50 mail_auth_ok / restore_drill
      - /srv/dok/data/ops:/srv/dok/data/ops
    depends_on:
      postgres:
        condition: service_healthy
      gotenberg:
        condition: service_started
    restart: unless-stopped
    networks: [dok]
    expose:
      - "8000"

  ops-agent:
    image: ${DOK_IMAGE:-dok-app:local}
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    env_file: .env
    environment:
      FILES_ROOT: /srv/dok/data/files
      OPS_REPO_ROOT: /srv/dok
      BACKUP_DIR: ${BACKUP_DIR:-/var/backups/dok}
      COMPOSE_PROJECT_NAME: dok
    # без docker-entrypoint (не нужна БД/миграции)
    entrypoint: ["python", "-m", "app.ops_agent"]
    volumes:
      - /srv/dok/data/files:/srv/dok/data/files
      - ../:/srv/dok
      - ${BACKUP_DIR:-/var/backups/dok}:${BACKUP_DIR:-/var/backups/dok}
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/data:ro
    # Порт только во внутренней сети compose (без ports:)
    expose:
      - "9100"
    restart: unless-stopped
    networks: [dok]

  worker:
    image: ${DOK_IMAGE:-dok-app:local}
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    env_file: .env
    environment:
      DB_URL: postgresql+psycopg://dok:${POSTGRES_PASSWORD}@postgres:5432/dok
      FILES_ROOT: /srv/dok/data/files
      GOTENBERG_URL: http://gotenberg:3000
      CORE_PATH: /app/core
      TEMPLATES_DIR: /srv/dok/data/templates
      APP_VERSION: ${APP_VERSION:-dev}
      BILLING_WORKER: "1"
      JOBS_INLINE: "0"
      SKIP_MIGRATIONS: "1"
    command: ["python", "-m", "app.worker"]
    volumes:
      - /srv/dok/data/files:/srv/dok/data/files
      - /srv/dok/data/templates:/srv/dok/data/templates
      # W-50: маркеры data/ops (restore_drill, mail_auth_ok, deployed_version)
      - /srv/dok/data/ops:/srv/dok/data/ops
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
      gotenberg:
        condition: service_started
    restart: unless-stopped
    networks: [dok]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dok
      POSTGRES_USER: dok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dok -d dok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [dok]

  gotenberg:
    build:
      context: .
      dockerfile: Dockerfile.gotenberg
    image: dok-gotenberg:8-liberation
    command:
      - "gotenberg"
      - "--chromium-disable-javascript"
      - "--api-timeout=120s"
    restart: unless-stopped
    networks: [dok]

networks:
  dok:
    driver: bridge

volumes:
  caddy_data: {}
  caddy_config: {}
  pgdata: {}
  # W-46: named volume files убран; данные в /srv/dok/data/files (bind).
  # Старый dok_files держать ≥7 дней, затем docker volume rm dok_files.